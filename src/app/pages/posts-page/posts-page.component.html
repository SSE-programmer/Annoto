<an-button
    class="create-post-button"
    label="Создать статью"
    ariaLabel="Создать статью"
    dashed
    (onClick)="openCreatePostModal()"
>
    <ng-template #iconRight>
        <an-icon-plus/>
    </ng-template>
</an-button>

@if (isPostsLoadingSignal()) {
    <div
        class="loader"
        aria-busy="true"
        aria-live="polite"
    >
        <an-loading-spinner/>
    </div>
} @else {
    <div class="posts-grid">
        @for (post of postsSignal(); track post.id) {
            <an-post-card
                [post]="post"
                (onClick)="goToPostPage(post.id)"
            />
        } @empty {
            <span class="not-found">Ничего не найдено</span>
        }
    </div>
}
